plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.4'
    id 'io.spring.dependency-management' version '1.1.3'
}

group = 'mif.prunus'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}
/* 외부 tomcat war 배포 설정 */
apply plugin: 'war'
/* 윈도우 탐색기 \findMe-API\build\libs\api.war */
/* XXX War 배포용 시도... > 배포 결과 > 실패 */
war.enabled = true
/* 외부용 */
war {
    archiveBaseName = 'api'
    archiveFileName = 'api.war'
    rootSpec.exclude("**/_doc**")
    rootSpec.exclude("**/frontend**")
}
bootWar.enabled = false

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.0.4'
    implementation 'org.springframework.boot:spring-boot-starter-security:3.0.4'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.0.4'
    implementation 'org.springframework.boot:spring-boot-starter-web:3.1.0'
    
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.5'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.5'
    
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    
    runtimeOnly 'com.mysql:mysql-connector-j:8.0.32'
	/* cmd에서 Lombok 버전을 확인하려면, cmd 경로를 바꿔서 java -jar lombok.jar */
	/* 개별 환경에 따른 발생할 오류 방지를 위한 버전 명시 */
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
	
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.1.0'
    testImplementation 'org.springframework.security:spring-security-test:6.0.2'
  
    /* 외부 tomcat war 배포 설정 (Runtime 전용이라 안지워도 무관) */
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
}

tasks.named('test') {
    useJUnitPlatform()
}
